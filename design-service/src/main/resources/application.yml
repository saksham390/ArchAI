server:
  port: 8082

spring:
  application:
    name: design-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/design_db}
    username: ${SPRING_DATASOURCE_USERNAME:archai}
    password: ${SPRING_DATASOURCE_PASSWORD:archai123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

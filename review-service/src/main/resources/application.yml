server:
  port: 8085

spring:
  application:
    name: review-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/review_db}
    username: ${SPRING_DATASOURCE_USERNAME:archai}
    password: ${SPRING_DATASOURCE_PASSWORD:archai123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

services:
  design:
    base-url: ${DESIGN_SERVICE_URL:http://localhost:8082}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8084}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

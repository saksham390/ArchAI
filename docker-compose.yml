version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-archai}
      POSTGRES_USER: ${POSTGRES_USER:-archai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archai123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archai} -d ${POSTGRES_DB:-archai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  service-registry:
    build: ./service-registry
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    depends_on:
      - service-registry
      - redis
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key-archai}

  auth-service:
    build: ./auth-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-archai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-archai123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-key-archai}

  design-service:
    build: ./design-service
    depends_on:
      postgres:
        condition: service_healthy
      service-registry:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/design_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-archai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-archai123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

  knowledge-service:
    build: ./knowledge-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/knowledge_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-archai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-archai123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

  ai-service:
    build: ./ai-service
    depends_on:
      kafka:
        condition: service_started
      knowledge-service:
        condition: service_started
      service-registry:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GEMINI_API_KEY: ${GEMINI_API_KEY:-demo}
      PINECONE_API_KEY: ${PINECONE_API_KEY:-demo}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-archai-rag}
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:8083
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

  review-service:
    build: ./review-service
    depends_on:
      postgres:
        condition: service_healthy
      design-service:
        condition: service_started
      ai-service:
        condition: service_started
      service-registry:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/review_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-archai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-archai123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      DESIGN_SERVICE_URL: http://design-service:8082
      AI_SERVICE_URL: http://ai-service:8084

  chat-service:
    build: ./chat-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      ai-service:
        condition: service_started
      service-registry:
        condition: service_started
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/chat_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-archai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-archai123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      AI_SERVICE_URL: http://ai-service:8084

  notification-service:
    build: ./notification-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      service-registry:
        condition: service_started
    ports:
      - "8087:8087"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-archai}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-archai123}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

volumes:
  postgres_data:
